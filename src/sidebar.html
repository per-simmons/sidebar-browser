<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="top">
    <div class="nav">
      <button id="toggle" title="Hide sidebar (⌘S)"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><line x1="6" y1="2.5" x2="6" y2="13.5"/></svg></button>
      <button id="back" title="Back (⌘[)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="fwd" title="Forward (⌘])"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <button id="reload" title="Reload (⌘R)"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></button>
    </div>
    <div id="urlbox">
      <span id="urltext"></span>
      <input id="input" spellcheck="false" autocomplete="off">
      <span id="findcount"></span>
    </div>
  </div>
  <div id="list">
    <div id="pinned" class="section" data-pinned="1"></div>
    <div id="divider"><span></span><button id="clear" title="Close all unpinned tabs">Clear</button></div>
    <button id="newtab"><span class="plus">+</span> New Tab</button>
    <div id="today" class="section" data-pinned="0"></div>
  </div>
  <div id="download"></div>
  <script src="sidebar.js"></script>
</body>
</html>
